<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Cartas 4×4 - Lotería</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Courier New',monospace;
    background:#0f172a;color:#e2e8f0;
    min-height:100vh;padding:20px;
  }
  .wrap{max-width:960px;margin:0 auto}
  h1{color:#facc15;font-size:1.4rem;margin-bottom:16px;text-align:center}
  .stats{
    background:#1e293b;border:2px solid #334155;border-radius:10px;
    padding:14px;margin-bottom:16px;font-size:0.95rem;line-height:1.7;
  }
  .stats span{color:#facc15;font-weight:bold}
  .ok{color:#22c55e !important}
  .bad{color:#ef4444 !important}
  .buttons{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  button{
    background:#22c55e;color:#fff;border:none;border-radius:8px;
    padding:10px 18px;font-size:14px;cursor:pointer;font-weight:bold;
    font-family:inherit;
  }
  button:hover{background:#16a34a}
  button.alt{background:#1e293b;color:#facc15;border:2px solid #334155}
  button.alt:hover{background:#334155;border-color:#facc15}
  button.copied{background:#16a34a}
  textarea{
    width:100%;height:420px;background:#020617;color:#22c55e;
    border:2px solid #334155;border-radius:10px;
    padding:12px;font-family:'Courier New',monospace;font-size:12px;
    resize:vertical;line-height:1.4;
  }
  .hint{font-size:0.85rem;color:#94a3b8;margin-top:10px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎴 Generador de Cartas 4×4</h1>

  <div class="stats" id="stats">Generando…</div>

  <div class="buttons">
    <button id="copyBtn" onclick="copiar()">📋 Copiar array</button>
    <button class="alt" onclick="descargar()">💾 Descargar tablas.json</button>
    <button class="alt" onclick="regenerar()">🔁 Regenerar con nueva semilla</button>
  </div>

  <textarea id="output" readonly></textarea>
  <p class="hint">
    Pega este array en <code>app.js</code> reemplazando <code>TABLAS_FIJAS_BASE</code>.
  </p>
</div>

<script>
// ============================================================
// CONFIGURACIÓN
// ============================================================
const COLS = 4;
const ROWS = 4;
const TOTAL = 50;
const IDS = 54;
const MAX_INTENTOS = 5000000;
const SEMILLA_DEFAULT = 2995588327;

// ============================================================
// GENERADOR DEFINITIVO CON CANDADO INTERNO Y GLOBAL ÚNICO
// ============================================================
function generarSet(semilla) {
    let seed = semilla >>> 0;
    const rnd = () => {
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        return seed / 4294967296;
    };
    const shuffle = (arr) => {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(rnd() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    };

    const pool = Array.from({ length: IDS }, (_, i) => i + 1);
    
    // ÚNICO Set Global: Guarda las 4 combinaciones de números ordenadas (ej. "2-8-27-53")
    // Sin importar si es fila, columna, centro, esquina o diagonal.
    const combinacionesUsadas = new Set();
    
    const out = [];
    let intentos = 0;
    const t0 = performance.now();

    // Función auxiliar: ordena los números para que el orden visual no importe
    const firma = (arr) => arr.slice().sort((a, b) => a - b).join("-");

    while (out.length < TOTAL && intentos < MAX_INTENTOS) {
        intentos++;
        const c = shuffle(pool).slice(0, COLS * ROWS);

        // 1. Extraer TODAS las figuras de esta carta
        const filas = [
            firma(c.slice(0, 4)), firma(c.slice(4, 8)), 
            firma(c.slice(8, 12)), firma(c.slice(12, 16))
        ];
        const cols = [
            firma([c[0], c[4], c[8], c[12]]), firma([c[1], c[5], c[9], c[13]]),
            firma([c[2], c[6], c[10], c[14]]), firma([c[3], c[7], c[11], c[15]])
        ];
        const esquinas = firma([c[0], c[3], c[12], c[15]]);
        const centros  = firma([c[5], c[6], c[9], c[10]]);
        const diag1    = firma([c[0], c[5], c[10], c[15]]);
        const diag2    = firma([c[3], c[6], c[9], c[12]]);

        // Juntar todas en un solo arreglo (12 figuras por carta)
        const figurasCarta = [ ...filas, ...cols, esquinas, centros, diag1, diag2 ];

        // 2. Candado Interno: ¿Se repite algo dentro de esta misma carta?
        // Si el Set tiene menos de 12, es porque hay duplicados internos (ej. esquina = centro)
        if (new Set(figurasCarta).size !== 12) continue;

        // 3. Candado Global: ¿Alguna de estas 12 figuras ya se usó en otra carta?
        let ok = true;
        for (const fig of figurasCarta) {
            if (combinacionesUsadas.has(fig)) { ok = false; break; }
        }
        if (!ok) continue;

        // 4. Si pasó todo, guardamos TODAS las figuras en el mismo candado
        figurasCarta.forEach(fig => combinacionesUsadas.add(fig));
        
        out.push(c);
    }

    const t1 = performance.now();

    return {
        tablas: out,
        intentos,
        ms: (t1 - t0).toFixed(0),
        totalCombinaciones: combinacionesUsadas.size,
        ok: out.length === TOTAL
    };
}

// ============================================================
// VERIFICACIÓN INDEPENDIENTE (Re-chequea lo generado)
// ============================================================
function verificarSet(tablas) {
    const combinacionesUsadas = new Set();
    let errores = 0;
    const firma = (arr) => arr.slice().sort((a, b) => a - b).join("-");

    tablas.forEach((t, i) => {
        // Extraer figuras
        const filas = [firma(t.slice(0,4)), firma(t.slice(4,8)), firma(t.slice(8,12)), firma(t.slice(12,16))];
        const cols = [firma([t[0],t[4],t[8],t[12]]), firma([t[1],t[5],t[9],t[13]]), firma([t[2],t[6],t[10],t[14]]), firma([t[3],t[7],t[11],t[15]])];
        const e = firma([t[0],t[3],t[12],t[15]]);
        const m = firma([t[5],t[6],t[9],t[10]]);
        const d1 = firma([t[0],t[5],t[10],t[15]]);
        const d2 = firma([t[3],t[6],t[9],t[12]]);

        const figurasCarta = [...filas, ...cols, e, m, d1, d2];

        // Chequeo Interno
        if (new Set(figurasCarta).size !== 12) { 
            errores++; 
            console.error(`Carta ${i+1}: Figuras internas repetidas`); 
        }

        // Chequeo Global
        figurasCarta.forEach(fig => {
            if (combinacionesUsadas.has(fig)) {
                errores++;
                console.error(`Combinación repetida en carta ${i+1}: [${fig}]`);
            }
            combinacionesUsadas.add(fig);
        });
    });

    return { errores, totalCombinaciones: combinacionesUsadas.size };
}

// ============================================================
// RENDER
// ============================================================
let resultadoActual = null;

function formatearArray(tablas) {
    let s = "const TABLAS_FIJAS_BASE = [\n";
    tablas.forEach((t, i) => {
        s += "  [" + t.join(", ") + "]";
        if (i < tablas.length - 1) s += ",";
        s += "\n";
    });
    s += "];\n";
    return s;
}

function render(semilla) {
    const stats = document.getElementById("stats");
    stats.innerHTML = "⏳ Generando con semilla <span>" + semilla + "</span>…";

    // pequeño timeout para que el navegador pinte el mensaje antes del bloqueo
    setTimeout(() => {
        const r = generarSet(semilla);
        const verif = verificarSet(r.tablas);

        resultadoActual = r;

        const okClass = (r.ok && verif.errores === 0) ? "ok" : "bad";

        stats.innerHTML = `
            <div>Semilla: <span>${semilla}</span></div>
            <div>Cartas generadas: <span class="${okClass}">${r.tablas.length} / ${TOTAL}</span></div>
            <div>Intentos: <span>${r.intentos.toLocaleString()}</span> — Tiempo: <span>${r.ms} ms</span></div>
            <div>Combinaciones Únicas Totales: <span class="${r.totalCombinaciones === TOTAL * 12 ? 'ok' : 'bad'}">
                ${r.totalCombinaciones} / ${TOTAL * 12}</span></div>
            <div>Verificación independiente: <span class="${verif.errores === 0 ? 'ok' : 'bad'}">
                ${verif.errores === 0 ? '✅ 0 errores (Ninguna figura se repite en ninguna forma ni orden)' : '❌ ' + verif.errores + ' errores'}</span></div>
        `;

        document.getElementById("output").value = formatearArray(r.tablas);
    }, 30);
}

function copiar() {
    const ta = document.getElementById("output");
    ta.select();
    document.execCommand("copy");
    const btn = document.getElementById("copyBtn");
    btn.classList.add("copied");
    btn.textContent = "✅ Copiado";
    setTimeout(() => {
        btn.classList.remove("copied");
        btn.textContent = "📋 Copiar array";
    }, 1500);
}

function descargar() {
    if (!resultadoActual) return;
    const blob = new Blob(
        [JSON.stringify(resultadoActual.tablas)],
        { type: "application/json" }
    );
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "tablas.json";
    a.click();
    URL.revokeObjectURL(url);
}

function regenerar() {
    const nueva = (Math.random() * 0xFFFFFFFF) >>> 0;
    render(nueva);
}

// arranque
render(SEMILLA_DEFAULT);
</script>
</body>
</html>
