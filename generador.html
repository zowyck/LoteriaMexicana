<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Cartas 4×4 - Lotería</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Courier New',monospace;
    background:#0f172a;color:#e2e8f0;
    min-height:100vh;padding:20px;
  }
  .wrap{max-width:960px;margin:0 auto}
  h1{color:#facc15;font-size:1.4rem;margin-bottom:16px;text-align:center}
  .stats{
    background:#1e293b;border:2px solid #334155;border-radius:10px;
    padding:14px;margin-bottom:16px;font-size:0.95rem;line-height:1.7;
  }
  .stats span{color:#facc15;font-weight:bold}
  .ok{color:#22c55e !important}
  .bad{color:#ef4444 !important}
  .buttons{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  button{
    background:#22c55e;color:#fff;border:none;border-radius:8px;
    padding:10px 18px;font-size:14px;cursor:pointer;font-weight:bold;
    font-family:inherit;
  }
  button:hover{background:#16a34a}
  button.alt{background:#1e293b;color:#facc15;border:2px solid #334155}
  button.alt:hover{background:#334155;border-color:#facc15}
  button.copied{background:#16a34a}
  textarea{
    width:100%;height:420px;background:#020617;color:#22c55e;
    border:2px solid #334155;border-radius:10px;
    padding:12px;font-family:'Courier New',monospace;font-size:12px;
    resize:vertical;line-height:1.4;
  }
  .hint{font-size:0.85rem;color:#94a3b8;margin-top:10px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎴 Generador de Cartas 4×4 — Set Fijo Verificado</h1>

  <div class="stats" id="stats">Generando…</div>

  <div class="buttons">
    <button id="copyBtn" onclick="copiar()">📋 Copiar array</button>
    <button class="alt" onclick="descargar()">💾 Descargar tablas.json</button>
    <button class="alt" onclick="regenerar()">🔁 Regenerar con nueva semilla</button>
  </div>

  <textarea id="output" readonly></textarea>
  <p class="hint">
    Pega este array en <code>app.js</code> reemplazando <code>TABLAS_FIJAS_BASE</code>.
  </p>
</div>

<script>
// ============================================================
// CONFIGURACIÓN
// ============================================================
const COLS = 4;
const ROWS = 4;
const TOTAL = 50;
const IDS = 54;
const MAX_INTENTOS = 5000000;
const SEMILLA_DEFAULT = 20240607;

// ============================================================
// GENERADOR CON LCG DETERMINISTA
// ============================================================
function generarSet(semilla) {
    let seed = semilla >>> 0;
    const rnd = () => {
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        return seed / 4294967296;
    };
    const shuffle = (arr) => {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(rnd() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    };

    const pool = Array.from({ length: IDS }, (_, i) => i + 1);
    const filasH  = new Set();
    const colsV   = new Set();
    const esq     = new Set();
    const centros = new Set();
    const out     = [];

    let intentos = 0;
    const t0 = performance.now();

    while (out.length < TOTAL && intentos < MAX_INTENTOS) {
        intentos++;
        const c = shuffle(pool).slice(0, COLS * ROWS);

        // 4 filas horizontales
        const kF = [];
        let ok = true;
        for (let r = 0; r < ROWS && ok; r++) {
            const k = "H:" + c.slice(r * COLS, r * COLS + COLS).join("-");
            if (filasH.has(k)) { ok = false; break; }
            kF.push(k);
        }

        // 4 columnas verticales
        const kC = [];
        if (ok) {
            for (let x = 0; x < COLS && ok; x++) {
                const col = [c[x], c[x + 4], c[x + 8], c[x + 12]];
                const k = "V:" + col.join("-");
                if (colsV.has(k)) { ok = false; break; }
                kC.push(k);
            }
        }

        // 4 esquinas (posiciones 0, 3, 12, 15)
        let kE = null;
        if (ok) {
            kE = [c[0], c[3], c[12], c[15]].sort((a, b) => a - b).join("-");
            if (esq.has(kE)) ok = false;
        }

        // 4 centros (posiciones 5, 6, 9, 10)
        let kM = null;
        if (ok) {
            kM = [c[5], c[6], c[9], c[10]].sort((a, b) => a - b).join("-");
            if (centros.has(kM)) ok = false;
        }

        if (!ok) continue;

        kF.forEach(k => filasH.add(k));
        kC.forEach(k => colsV.add(k));
        esq.add(kE);
        centros.add(kM);
        out.push(c);
    }

    const t1 = performance.now();

    return {
        tablas: out,
        intentos,
        ms: (t1 - t0).toFixed(0),
        filas: filasH.size,
        cols: colsV.size,
        esquinas: esq.size,
        centros: centros.size,
        ok: out.length === TOTAL
    };
}

// ============================================================
// VERIFICACIÓN INDEPENDIENTE (re-chequea lo generado)
// ============================================================
function verificarSet(tablas) {
    const F = new Set(), C = new Set(), E = new Set(), M = new Set();
    let errores = 0;

    tablas.forEach((t, i) => {
        if (t.length !== 16 || new Set(t).size !== 16) {
            console.error(`Carta #${i + 1}: no tiene 16 IDs únicos`);
            errores++;
        }
        for (let r = 0; r < 4; r++) {
            const k = "H:" + t.slice(r * 4, r * 4 + 4).join("-");
            if (F.has(k)) { errores++; console.error(`Fila repetida: carta ${i+1}`); }
            F.add(k);
        }
        for (let x = 0; x < 4; x++) {
            const col = [t[x], t[x+4], t[x+8], t[x+12]];
            const k = "V:" + col.join("-");
            if (C.has(k)) { errores++; console.error(`Columna repetida: carta ${i+1}`); }
            C.add(k);
        }
        const ke = [t[0], t[3], t[12], t[15]].sort((a,b)=>a-b).join("-");
        if (E.has(ke)) { errores++; console.error(`Esquinas repetidas: carta ${i+1}`); }
        E.add(ke);
        const km = [t[5], t[6], t[9], t[10]].sort((a,b)=>a-b).join("-");
        if (M.has(km)) { errores++; console.error(`Centros repetidos: carta ${i+1}`); }
        M.add(km);
    });

    return { errores, filas: F.size, cols: C.size, esquinas: E.size, centros: M.size };
}

// ============================================================
// RENDER
// ============================================================
let resultadoActual = null;

function formatearArray(tablas) {
    let s = "const TABLAS_FIJAS_BASE = [\n";
    tablas.forEach((t, i) => {
        s += "  [" + t.join(", ") + "]";
        if (i < tablas.length - 1) s += ",";
        s += "\n";
    });
    s += "];\n";
    return s;
}

function render(semilla) {
    const stats = document.getElementById("stats");
    stats.innerHTML = "⏳ Generando con semilla <span>" + semilla + "</span>…";

    // pequeño timeout para que el navegador pinte el mensaje antes del bloqueo
    setTimeout(() => {
        const r = generarSet(semilla);
        const verif = verificarSet(r.tablas);

        resultadoActual = r;

        const okClass = (r.ok && verif.errores === 0) ? "ok" : "bad";

        stats.innerHTML = `
            <div>Semilla: <span>${semilla}</span></div>
            <div>Cartas generadas: <span class="${okClass}">${r.tablas.length} / ${TOTAL}</span></div>
            <div>Intentos: <span>${r.intentos.toLocaleString()}</span> — Tiempo: <span>${r.ms} ms</span></div>
            <div>Filas únicas: <span class="${r.filas === 200 ? 'ok' : 'bad'}">${r.filas} / 200</span></div>
            <div>Columnas únicas: <span class="${r.cols === 200 ? 'ok' : 'bad'}">${r.cols} / 200</span></div>
            <div>Esquinas únicas: <span class="${r.esquinas === 50 ? 'ok' : 'bad'}">${r.esquinas} / 50</span></div>
            <div>Centros únicos: <span class="${r.centros === 50 ? 'ok' : 'bad'}">${r.centros} / 50</span></div>
            <div>Verificación independiente: <span class="${verif.errores === 0 ? 'ok' : 'bad'}">
                ${verif.errores === 0 ? '✅ 0 errores' : '❌ ' + verif.errores + ' errores'}</span></div>
        `;

        document.getElementById("output").value = formatearArray(r.tablas);
    }, 30);
}

function copiar() {
    const ta = document.getElementById("output");
    ta.select();
    document.execCommand("copy");
    const btn = document.getElementById("copyBtn");
    btn.classList.add("copied");
    btn.textContent = "✅ Copiado";
    setTimeout(() => {
        btn.classList.remove("copied");
        btn.textContent = "📋 Copiar array";
    }, 1500);
}

function descargar() {
    if (!resultadoActual) return;
    const blob = new Blob(
        [JSON.stringify(resultadoActual.tablas)],
        { type: "application/json" }
    );
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "tablas.json";
    a.click();
    URL.revokeObjectURL(url);
}

function regenerar() {
    const nueva = (Math.random() * 0xFFFFFFFF) >>> 0;
    render(nueva);
}

// arranque
render(SEMILLA_DEFAULT);
</script>
</body>
</html>
