<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lotería Mexicana</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lotería">

</head>

<body>

<div id="loadProgress">
    <p id="loadText">Preparando para uso offline…</p>
    <div class="loadBarWrap">
        <div id="loadBar"></div>
    </div>
</div>

<div class="container">

    <div class="main">

        <!-- ===================== MODO NAIPES ===================== -->
        <div id="cardView">
            <div id="topBar" style="display:none;">
                <div id="remaining">54 naipes restantes</div>
                <div id="historyList"></div>
            </div>

            <img id="cardImage" src="assets/Logo.png" alt="Lotería Mexicana" onclick="toggleAuto()">

            <div class="controls">
                <button id="playPauseBtn" onclick="toggleAuto()">▶ Iniciar</button>
                <button onclick="drawCard()">⏭ Naipe</button>
                <button onclick="restartGame()">🔄 Reiniciar</button>
            </div>

            <!-- Barra inferior: Tiempo + Cartas -->
            <div class="bottomBar">
                <div class="speedBox">
                    <button id="speedBtn" class="speedBtn" onclick="toggleSpeedMenu(event)">
                        ⏱ 4 s
                    </button>
                    <div id="speedMenu" class="speedMenu">
                        <button onclick="setSpeed(3000, this)">3 s</button>
                        <button onclick="setSpeed(4000, this)" class="active">4 s</button>
                        <button onclick="setSpeed(5000, this)">5 s</button>
                        <button onclick="setSpeed(6000, this)">6 s</button>
                        <button onclick="setSpeed(7000, this)">7 s</button>
                    </div>

                    <select id="speed" style="display:none;">
                        <option value="3000">3 s</option>
                        <option value="4000" selected>4 s</option>
                        <option value="5000">5 s</option>
                        <option value="6000">6 s</option>
                        <option value="7000">7 s</option>
                    </select>
                </div>

                <button id="gotoTablesBtn" class="modeBtn" onclick="setMode('tables')">🧩 Cartas</button>
            </div>
        </div>

        <!-- ===================== MODO CARTAS ===================== -->
        <div id="tablesView" style="display:none;">

            <div id="tablesList">
                <h2 style="color:#facc15;margin-bottom:12px;">Elige una carta (50)</h2>
                <div id="tablesGrid"></div>
            </div>

            <div id="tablePlay" style="display:none;">
                <div id="tableTitle" style="color:#facc15;font-weight:bold;margin-bottom:8px;"></div>
                <div id="tableBoard"></div>
                <div class="controls" style="margin-top:15px;">
                    <button onclick="volverAListaTablas()">← Regresar</button>
                    <button onclick="reiniciarMarcado()">🔄 Reiniciar marcas</button>
                </div>
            </div>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
