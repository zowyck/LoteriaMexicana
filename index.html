<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lotería Mexicana</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lotería">

</head>

<body>

<div id="loadProgress">
    <p id="loadText">Preparando para uso offline…</p>
    <div class="loadBarWrap">
        <div id="loadBar"></div>
    </div>
</div>

<div class="container">

    <div class="main">

        <!-- Barra superior: contador + historial -->
        <div id="topBar" style="display:none;">
            <div id="remaining">54 cartas restantes</div>
            <div id="historyList"></div>
        </div>

        <img id="cardImage" src="assets/Logo.png" alt="Lotería Mexicana" onclick="toggleAuto()">

        <div class="controls">
            <button id="playPauseBtn" onclick="toggleAuto()">▶ Iniciar</button>
            <button onclick="drawCard()">⏭ Carta</button>
            <button onclick="restartGame()">🔄 Reiniciar</button>
        </div>

        <div class="speedBox">
            <button id="speedBtn" class="speedBtn" onclick="toggleSpeedMenu(event)">
                ⏱ 7 s
            </button>
            <div id="speedMenu" class="speedMenu">
                <button onclick="setSpeed(4000, this)">4 s</button>
                <button onclick="setSpeed(5000, this)">5 s</button>
                <button onclick="setSpeed(6000, this)">6 s</button>
                <button onclick="setSpeed(7000, this)" class="active">7 s</button>
                <button onclick="setSpeed(8000, this)">8 s</button>
                <button onclick="setSpeed(9000, this)">9 s</button>
                <button onclick="setSpeed(10000, this)">10 s</button>
            </div>

            <!-- Select oculto: guarda el valor real que usan startAuto y setSpeed -->
            <select id="speed" style="display:none;">
                <option value="4000">4 s</option>
                <option value="5000">5 s</option>
                <option value="6000">6 s</option>
                <option value="7000" selected>7 s</option>
                <option value="8000">8 s</option>
                <option value="9000">9 s</option>
                <option value="10000">10 s</option>
            </select>
        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
