<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lotería Mexicana</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lotería">

</head>

<body>

<div id="loadProgress">
    <p id="loadText">Preparando para uso offline…</p>
    <div class="loadBarWrap">
        <div id="loadBar"></div>
    </div>
</div>

<div class="container">

    <div class="main">

        <h1 id="titulo" style="display:none;">Lotería Mexicana</h1>

        <img id="cardImage" src="assets/Logo.png" alt="Lotería Mexicana">

        <h2 id="cardName" style="display:none;">
            Presiona Iniciar
        </h2>

        <div id="remaining" style="display:none;">
            54 cartas restantes
        </div>

        <div class="controls">

            <button id="playPauseBtn" onclick="toggleAuto()">
                ▶ Iniciar
            </button>

            <button onclick="drawCard()">
                ⏭ Carta
            </button>

            <button onclick="restartGame()">
                🔄 Reiniciar
            </button>

        </div>

        <div class="speedBox">

            <label>Tiempo:</label>

            <select id="speed">
                <option value="4000">4 s</option>
                <option value="5000">5 s</option>
                <option value="6000">6 s</option>
                <option value="7000" selected>7 s</option>
                <option value="8000">8 s</option>
                <option value="9000">9 s</option>
                <option value="10000">10 s</option>
            </select>

        </div>

    </div>

    <div class="history">
        <div id="historyList"></div>
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
